{% extends "base.html" %}

{% block title %}Каталог — AvitoGarden{% endblock %}

{% block content %}
<div class="catalog-page">
    <!-- Sidebar Filters -->
    <aside class="catalog-page__filters">
        <h3 class="catalog-page__filters-title">Фильтры</h3>
        
        <div class="filter-group">
            <label class="filter-group__label">Категория</label>
            <select id="filterCategory" class="filter-group__select">
                <option value="">Все категории</option>
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-group__label">Цена, ₽</label>
            <div class="filter-group__price-labels">
                <span>от</span>
                <span>до</span>
            </div>
            <div class="filter-group__price-row">
                <input type="number" id="minPrice" class="filter-group__price-input" placeholder="0" min="0">
                <span class="filter-group__price-sep">—</span>
                <input type="number" id="maxPrice" class="filter-group__price-input" placeholder="99999" min="0">
            </div>
        </div>

        <button id="applyFilters" class="btn btn--primary">Применить</button>
        <button id="resetFilters" class="btn btn--secondary">Сбросить</button>
    </aside>

    <!-- Catalog Grid -->
    <div class="catalog-page__content">
        <div class="catalog-page__header">
            <h1>Каталог товаров</h1>
            <span class="catalog-page__count" id="catalogCount">Загрузка...</span>
        </div>

        <div class="catalog-page__grid" id="catalogGrid">
            <!-- Карточки товаров будут вставлены через JS -->
        </div>

        <div class="catalog-page__empty" id="catalogEmpty" style="display: none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <p>Ничего не найдено. Попробуйте изменить фильтры.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/catalog.js"></script>
{% endblock %}
